services:
  - type: web
    name: vestiq-backend
    runtime: node
    region: singapore        # closest to India — change to oregon/frankfurt if preferred
    plan: free               # upgrade to starter ($7/mo) to avoid sleep
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000            # Render always uses 10000 internally; keep this
      - key: CLIENT_ORIGIN
        sync: false             # set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROK_BASE_URL
        value: https://api.x.ai/v1
      - key: GROK_MODEL
        value: grok-4-5
      - key: QUOTE_CACHE_TTL
        value: 15
      - key: INDEX_CACHE_TTL
        value: 30
      - key: NEWS_CACHE_TTL
        value: 600
